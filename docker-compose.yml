services:
  mysql:
    image: mysql:8.4
    container_name: kestro-mysql
    environment:
      MYSQL_DATABASE: kestro
      MYSQL_USER: kestro
      MYSQL_PASSWORD: kestro
      MYSQL_ROOT_PASSWORD: kestro_root
    ports:
      - "3306:3306"
    volumes:
      - kestro-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u kestro --password=$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kestro-mysql:
