services:
  postgres:
    image: postgres:16-alpine
    container_name: kestro-postgres
    environment:
      POSTGRES_DB: kestro
      POSTGRES_USER: kestro
      POSTGRES_PASSWORD: kestro
    ports:
      - "5432:5432"
    volumes:
      - kestro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestro -d kestro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kestro-postgres:

